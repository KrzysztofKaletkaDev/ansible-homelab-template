[defaults]
# Path to the default inventory
inventory = inventory/hosts.yml

# Default SSH user for connections to nodes (adjust to your own environment)
remote_user = sysadmin

# Disable host key checking (convenient in a local homelab)
host_key_checking = False

# Disable creation of .retry files when a playbook fails
retry_files_enabled = False

# More readable presentation of task results in the terminal (YAML output)
stdout_callback = default
callback_result_format = yaml

[privilege_escalation]
# Automatic privilege escalation to root via sudo
become = True
become_method = sudo
become_user = root
become_ask_pass = False
