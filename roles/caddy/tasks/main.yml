---
# ==============================================================================
# ROLE: Caddy Reverse Proxy (roles/caddy/tasks/main.yml)
# Compiles the Caddy image with the Cloudflare DNS module and deploys the Reverse Proxy.
# ==============================================================================

- name: Stwórz strukturę katalogów dla Caddy
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ caddy_dir | default('/opt/caddy') }}"
    - "{{ caddy_dir | default('/opt/caddy') }}/etc"
    - "{{ caddy_dir | default('/opt/caddy') }}/data"
    - "{{ caddy_dir | default('/opt/caddy') }}/config"

- name: Wygeneruj plik Dockerfile z szablonu Jinja2
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: "{{ caddy_dir | default('/opt/caddy') }}/Dockerfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  register: caddy_dockerfile

# camera_wall_trusted_ips skips the camera-wall login by remote_ip (ADR-0012).
# Docker hands Caddy the network gateway as the source for everything it
# proxies instead of routing (host-local and IPv6 clients), and container
# addresses for tunnel traffic — so a Docker address on the list would open
# the login to all of those. Refuse them: the 172.16.0.0/12 default pools
# outright, plus every gateway actually present on this host.
- name: Pobierz listę sieci Dockera (walidacja camera_wall_trusted_ips)
  ansible.builtin.command:
    cmd: docker network ls -q
  register: caddy_docker_network_ids
  changed_when: false
  check_mode: false
  when: camera_wall_trusted_ips | default([]) | length > 0

- name: Pobierz bramy sieci Dockera (walidacja camera_wall_trusted_ips)
  ansible.builtin.command:
    argv: "{{ ['docker', 'network', 'inspect'] + caddy_docker_network_ids.stdout_lines }}"
  register: caddy_docker_networks
  changed_when: false
  check_mode: false
  when: camera_wall_trusted_ips | default([]) | length > 0

- name: Zweryfikuj camera_wall_trusted_ips (tylko adresy LAN, nigdy Dockera)
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}$')
      - item is not match('^(0|127)\.')
      - item is not match('^172\.(1[6-9]|2[0-9]|3[01])\.')
      - item not in caddy_docker_gateways
    fail_msg: >-
      camera_wall_trusted_ips: '{{ item }}' odrzucony — dozwolone są wyłącznie
      pojedyncze adresy IPv4 klientów w LAN, nigdy adres z sieci Dockera
      (brama {{ caddy_docker_gateways | join(', ') }} przepuściłaby ruch
      z samego hosta i z IPv6 bez logowania). Patrz ADR-0012.
    quiet: true
  loop: "{{ camera_wall_trusted_ips | default([]) }}"
  vars:
    caddy_docker_gateways: >-
      {{ caddy_docker_networks.stdout | from_json
         | map(attribute='IPAM') | map(attribute='Config') | select
         | flatten | selectattr('Gateway', 'defined')
         | map(attribute='Gateway') | list }}

- name: Wygeneruj plik Caddyfile z szablonu Jinja2
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ caddy_dir | default('/opt/caddy') }}/etc/Caddyfile"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    # Contains the camera wall basic_auth hash from Vault
    mode: '0600'
  notify: Reload caddy

- name: Wygeneruj plik docker-compose.yml z szablonu Jinja2
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ caddy_dir | default('/opt/caddy') }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: "Sprawdź czy lokalnie istnieje obraz custom-caddy:{{ caddy_image_tag }}"
  ansible.builtin.command:
    cmd: "docker image inspect custom-caddy:{{ caddy_image_tag }}"
  register: caddy_image_check
  failed_when: false
  changed_when: false

- name: Zbuduj obraz custom-caddy:cloudflare przez Docker CLI
  ansible.builtin.command:
    cmd: "docker build -t custom-caddy:{{ caddy_image_tag }} ."
    chdir: "{{ caddy_dir | default('/opt/caddy') }}"
  when: caddy_image_check.rc != 0 or caddy_dockerfile.changed
  changed_when: true

- name: Otwórz porty HTTP/HTTPS (80, 443 TCP/UDP dla QUIC) w zaporze firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 80/tcp
    - 443/tcp
    - 443/udp

- name: Uruchom stos Docker Compose z Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ caddy_dir | default('/opt/caddy') }}"
    state: present
