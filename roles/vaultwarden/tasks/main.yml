---
# ==============================================================================
# ROLE: Vaultwarden (roles/vaultwarden/tasks/main.yml)
# Deploys the Vaultwarden container (self-hosted Bitwarden) behind the Caddy reverse proxy.
#
# NOTE (migrating an existing instance):
# This role does NOT initialize or overwrite data — `state: directory`
# in the first task is safe for already existing content.
# If you are migrating an old `data/` folder (database, RSA keys, attachments),
# copy it (e.g. via rsync/scp) to the target host at:
#   {{ vaultwarden_dir | default('/opt/vaultwarden') }}/data
# before or right after the first playbook run — the container will pick up
# the existing database instead of creating a new user.
# ==============================================================================

- name: Stwórz strukturę katalogów dla Vaultwarden
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - "{{ vaultwarden_dir | default('/opt/vaultwarden') }}"
    - "{{ vaultwarden_dir | default('/opt/vaultwarden') }}/data"

- name: Wygeneruj plik docker-compose.yml z szablonu Jinja2
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ vaultwarden_dir | default('/opt/vaultwarden') }}/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

- name: Uruchom stos Docker Compose z Vaultwarden
  community.docker.docker_compose_v2:
    project_src: "{{ vaultwarden_dir | default('/opt/vaultwarden') }}"
    state: present
