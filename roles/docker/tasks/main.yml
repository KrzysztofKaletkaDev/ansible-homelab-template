---
# ==============================================================================
# ROLE: Docker & Docker Compose Engine (roles/docker/tasks/main.yml)
# ==============================================================================

- name: Zainstaluj dnf-plugins-core
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Dodaj repozytorium Docker CE
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Podmień $releasever na główną wersję systemu w pliku repo
  ansible.builtin.replace:
    path: /etc/yum.repos.d/docker-ce.repo
    regexp: '\$releasever'
    replace: "{{ ansible_distribution_major_version }}"

- name: Odśwież pamięć podręczną DNF
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: false

- name: Zainstaluj silnik Docker oraz plugin Docker Compose
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Uruchom i włącz usługę Docker w systemd
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Dodaj użytkownika systemowego do grupy docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
